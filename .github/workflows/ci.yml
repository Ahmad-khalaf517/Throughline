name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # postgres:15-alpine service container for the Appendix C behaviour suite
    # (Project Setup section 9). Testcontainers is used locally; this is the
    # CI-native equivalent, same image, same migrations.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: throughline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/throughline_test
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/throughline_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generates .next/types (e.g. LayoutProps/PageProps) that tsconfig.json
      # includes; without this, typecheck fails on a fresh checkout since
      # .next/ is gitignored and never produced by a full build here.
      - run: pnpm exec next typegen

      - run: pnpm typecheck

      # Boundary violations (eslint-plugin-boundaries) fail the build here.
      - run: pnpm lint

      # Hooks can be bypassed with --no-verify; CI cannot.
      - run: pnpm format:check

      - run: pnpm test

      - run: pnpm test:int

      # ERD section 14 additionally requires T34 (anon-role denial) run once
      # against the real Supabase project. That is a manual slice-1 checklist
      # item (Project Setup section 9), not a CI step - the service container
      # above has no Supabase anon/authenticated roles to test against.
